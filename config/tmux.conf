bind C-s setw synchronize-panes
bind C-m if -F '#{pane_input_off}' \
    'select-pane -e' \
    'select-pane -d'
set -g allow-rename off
set -g mouse on
setw -g mode-keys vi
set -g history-limit 10000

# Workaround for TMOUT
setw -g remain-on-exit on
bind R respawn-pane

# Fix terminal escape sequences
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Advertise OSC 52 clipboard writes (Ms) for both sides of the tmux pipe:
# the client pattern lets tmux re-emit the selection to the attached terminal
# (Windows Terminal writes it to the Windows clipboard; this distro's
# ncurses entries lack Ms), and the pane pattern tells programs inside tmux
# they may send it. Terminals without OSC 52 support simply ignore it.
# Required for the OpenCode TUI and other OSC 52 apps to copy outside tmux.
set -ga terminal-overrides ",screen-256color*:Ms=\\E]52;%p1%s;%p2%s\\7"
set -ga terminal-overrides ",xterm*:Ms=\\E]52;%p1%s;%p2%s\\7"
set -g set-clipboard on
# Also forward DCS-wrapped OSC 52 (\ePtmux;...), used by OpenTUI-based apps.
set -g allow-passthrough on
